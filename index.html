<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Aparna! ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden; /* Keeps floating hearts from breaking the page */
        }
        
        /* The Interactive Gift */
        #gift-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .gift-box {
            font-size: 100px;
            cursor: pointer;
            animation: bounce 2s infinite;
            transition: transform 0.3s;
        }
        .gift-box:active {
            transform: scale(0.8);
        }
        .tap-text {
            color: white;
            font-size: 1.5em;
            font-weight: 700;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* Bouncing Animation for the Gift */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }

        /* The Main Birthday Card (Hidden at first) */
        #card-screen {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(214, 51, 108, 0.3);
            max-width: 90%;
            width: 400px;
            z-index: 5;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: #ff477e;
            font-size: 2.5em;
            margin: 0 0 15px 0;
            font-weight: 900;
        }
        p {
            color: #555;
            font-size: 1.2em;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        
        /* Photo Placeholder */
        .photo-frame {
            width: 100%;
            height: 200px;
            background-color: #ffe1e8;
            border: 3px dashed #ff477e;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff477e;
            font-weight: bold;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            font-size: 25px;
            color: #ff477e;
            bottom: -50px;
            animation: floatUp 4s linear forwards;
            opacity: 0.8;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: The Gift -->
    <div id="gift-screen">
        <div class="gift-box" onclick="openGift()">🎁</div>
        <div class="tap-text">Tap to open, Aparna!</div>
    </div>

    <!-- SCREEN 2: The Card -->
    <div id="card-screen">
        <h1>Happy Birthday,<br>Aparna! 🎂</h1>
        
        <!-- OPTIONAL: Put an image link inside the src="" below to show a photo of you two -->
        <!-- Example: <img src="https://imagelink.com/photo.jpg"> -->
        <div class="photo-frame">
            <img src="" alt="Insert Photo Here (Edit the Code)" onerror="this.style.display='none'">
            <span id="photo-text">📸 Our Cute Memory Here</span>
        </div>

        <p>You make every day brighter just by being in it. I am so lucky to have you in my life. I hope today brings you as much joy as you bring me!</p>
        <p><strong>I love you forever! ❤️</strong></p>
    </div>

    <!-- JavaScript for Interactivity -->
    <script>
        function openGift() {
            // Hide the gift screen
            document.getElementById('gift-screen').style.display = 'none';
            // Show the birthday card
            document.getElementById('card-screen').style.display = 'block';
            
            // Trigger floating hearts explosion
            for(let i = 0; i < 40; i++) {
                setTimeout(createHeart, i * 50);
            }
            
            // Keep creating some hearts in the background
            setInterval(createHeart, 800);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            
            // Randomize position and size
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            
            document.body.appendChild(heart);
            
            // Remove heart after animation to keep the phone running smoothly
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>

</body>
</html>
